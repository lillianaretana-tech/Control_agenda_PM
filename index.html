<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f2937"><link rel="manifest" href="manifest.webmanifest"><title>Control PM Móvil</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:680px;margin:auto;padding:18px 14px 88px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:24px;margin:0}.muted{color:#687386;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;background:#f5f6f8;padding:8px 0;z-index:2}.tab{border:0;border-radius:12px;padding:11px 8px;background:#fff;font-weight:700;box-shadow:0 1px 4px #0001}.tab.active{background:#1f2937;color:#fff}.section{margin:18px 0 8px;font-size:16px}.count{display:inline-block;min-width:24px;text-align:center;border-radius:99px;background:#e5e7eb;padding:2px 7px;font-size:12px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0000000d;border-left:5px solid #9ca3af}.late{border-left-color:#dc2626}.today{border-left-color:#ea580c}.move{border-left-color:#d97706}.soon{border-left-color:#2563eb}.done{opacity:.62}.title{font-weight:800;font-size:16px}.meta{font-size:12px;color:#687386;margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{cursor:pointer}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:750}.primary{background:#1f2937;color:white}.secondary{background:#eef0f3;color:#273142}.ghost{background:transparent;border:1px solid #d7dbe1}.search{width:100%;padding:12px;border:1px solid #d7dbe1;border-radius:12px;font-size:16px;margin:8px 0 12px}.empty{padding:26px;text-align:center;color:#687386}.login{max-width:420px;margin:12vh auto;background:white;padding:22px;border-radius:18px;box-shadow:0 4px 22px #0001}.login input{width:100%;padding:12px;margin:7px 0;border:1px solid #d7dbe1;border-radius:10px;font-size:16px}.login .btn{width:100%;margin-top:8px}.error{color:#b91c1c;font-size:13px}.hidden{display:none!important}.note{width:100%;border:1px solid #d7dbe1;border-radius:9px;padding:8px;margin-top:8px}.badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:99px;background:#eef0f3}.top-actions{display:flex;gap:6px}.iconbtn{border:0;background:#fff;border-radius:10px;padding:8px 10px}
</style></head><body>
<div id="login" class="login"><h1>Control PM Móvil</h1><p class="muted">Tu lista de hoy, sin cargar todo el mes encima 🙂</p><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button class="btn primary" id="loginBtn">Entrar</button><div id="loginError" class="error"></div></div>
<div id="app" class="wrap hidden"><header><div><h1>Control PM</h1><div id="date" class="muted"></div></div><div class="top-actions"><button id="refresh" class="iconbtn">↻</button><button id="logout" class="iconbtn">Salir</button></div></header><div class="tabs"><button class="tab active" data-tab="hoy">HOY</button><button class="tab" data-tab="proximos">PRÓXIMOS</button><button class="tab" data-tab="buscar">BUSCAR</button></div><main id="content"></main></div>
<script>
const SUPABASE_URL='https://vgkyoyosjewdygxtnqvu.supabase.co';
const SUPABASE_KEY='sb_publishable_QOZiGlFdzOcCQtqDqI_I_A_ian2l-pf';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); let rows=[],tab='hoy';
const localDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Costa_Rica',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const pretty=d=>d?new Intl.DateTimeFormat('es-CR',{timeZone:'UTC',day:'numeric',month:'short'}).format(new Date(d+'T12:00:00Z')):'';
async function start(){const {data:{session}}=await sb.auth.getSession(); if(session) showApp();}
async function showApp(){login.classList.add('hidden');app.classList.remove('hidden');date.textContent=new Intl.DateTimeFormat('es-CR',{dateStyle:'full',timeZone:'America/Costa_Rica'}).format(new Date());await load();}
async function load(){content.innerHTML='<div class="empty">Cargando prioridades…</div>';const {data,error}=await sb.from('pm_task_status').select('id,task_id,period_key,due_date,alert_date,status,completed_at,note,pm_tasks(id,activity,category,frequency,scope,action_required,priority,task_type,active,sort_order)').eq('pm_tasks.active',true);if(error){content.innerHTML='<div class="error">'+error.message+'</div>';return;}rows=(data||[]).filter(x=>x.pm_tasks).sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')||a.pm_tasks.sort_order-b.pm_tasks.sort_order);render();}
function bucket(r){const t=localDate();if(['hecho','cerrado'].includes(r.status))return'done';if(r.due_date<t)return'late';if(r.due_date===t)return'today';if(r.alert_date&&r.alert_date<=t)return'move';return'soon'}
function card(r){const b=bucket(r),t=r.pm_tasks;return `<article class="card ${b}"><div style="display:flex;justify-content:space-between;gap:8px"><div class="title">${esc(t.activity)}</div><span class="badge">${esc(t.priority)}</span></div><div class="meta">${esc(t.category||'')} · ${esc(t.scope||'')} ${r.due_date?'· vence '+pretty(r.due_date):''}</div><div>${esc(t.action_required||'')}</div>${r.note?`<div class="meta">📝 ${esc(r.note)}</div>`:''}<div class="actions">${!['hecho','cerrado'].includes(r.status)?`<button class="btn primary" onclick="doneTask(${r.id},'${t.task_type}')">✓ ${t.task_type==='abierta'?'CERRAR':'HECHO'}</button><button class="btn secondary" onclick="toggleNote(${r.id})">NOTA</button>`:'<span class="badge">✓ Completado</span>'}</div><div id="n${r.id}" class="hidden"><textarea class="note" id="note${r.id}" placeholder="Nota breve…">${esc(r.note||'')}</textarea><button class="btn ghost" onclick="saveNote(${r.id})">Guardar nota</button></div></article>`}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const t=localDate();if(tab==='buscar'){content.innerHTML='<input class="search" id="q" placeholder="Buscar control, proyecto…" oninput="searchNow()"><div id="results"></div>';searchNow();return;}if(tab==='proximos'){const a=rows.filter(r=>bucket(r)==='soon'&&!['hecho','cerrado'].includes(r.status));content.innerHTML='<h2 class="section">Próximos <span class="count">'+a.length+'</span></h2>'+(a.map(card).join('')||'<div class="empty">No hay próximos pendientes.</div>');return;}const groups=[['late','🔴 Atrasadas'],['today','🟠 Vencen hoy'],['move','🟡 Empezar ahora']];content.innerHTML=groups.map(([k,l])=>{const a=rows.filter(r=>bucket(r)===k);return `<h2 class="section">${l} <span class="count">${a.length}</span></h2>${a.map(card).join('')||'<div class="empty">Nada aquí 🎉</div>'}`}).join('');}
function searchNow(){const q=(document.getElementById('q')?.value||'').toLowerCase();const a=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));document.getElementById('results').innerHTML=a.map(card).join('')||'<div class="empty">Sin resultados.</div>'}
async function doneTask(id,type){if(!confirm(type==='abierta'?'¿Cerrar este pendiente?':'¿Marcar como hecho?'))return;const status=type==='abierta'?'cerrado':'hecho';const {error}=await sb.from('pm_task_status').update({status,completed_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await load();}
function toggleNote(id){document.getElementById('n'+id).classList.toggle('hidden')}
async function saveNote(id){const note=document.getElementById('note'+id).value.trim();const {error}=await sb.from('pm_task_status').update({note,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await load();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
loginBtn.onclick=async()=>{loginError.textContent='';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)loginError.textContent='No pude entrar: '+error.message;else showApp();};logout.onclick=async()=>{await sb.auth.signOut();location.reload()};refresh.onclick=load;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});start();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
